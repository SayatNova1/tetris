<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simple Tetris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        
        .game-container {
            display: flex;
            gap: 30px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(10, 30px);
            grid-template-rows: repeat(20, 30px);
            gap: 1px;
            background: #0a0a0a;
            padding: 5px;
            border-radius: 8px;
            border: 1px solid rgba(78, 205, 196, 0.2);
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.1), inset 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        .cell {
            width: 30px;
            height: 30px;
            background: #1a1a1a;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }
        
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 150px;
        }
        
        .panel-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .panel-title {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .panel-value {
            font-size: 24px;
            font-weight: bold;
            color: #4ecdc4;
            transition: transform 0.15s ease, color 0.15s ease;
        }

        .panel-value.pop {
            transform: scale(1.3);
            color: #ffffff;
        }
        
        .next-piece {
            display: grid;
            grid-template-columns: repeat(4, 20px);
            grid-template-rows: repeat(4, 20px);
            gap: 1px;
            margin: 10px auto;
        }
        
        .next-cell {
            width: 20px;
            height: 20px;
            background: #1a1a1a;
            border-radius: 2px;
        }
        
        .controls {
            font-size: 12px;
            color: #888;
            line-height: 1.8;
        }
        
        .controls span {
            color: #4ecdc4;
        }
        
        .game-over {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }
        
        .game-over.show {
            display: flex;
        }
        
        .game-over h2 {
            font-size: 48px;
            color: #ff6b6b;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }
        
        .game-over button {
            padding: 15px 40px;
            font-size: 18px;
            background: #4ecdc4;
            border: none;
            border-radius: 5px;
            color: #1a1a2e;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        .game-over button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(78, 205, 196, 0.4);
        }
        
        .start-btn {
            padding: 10px 25px;
            font-size: 16px;
            background: #4ecdc4;
            border: none;
            border-radius: 5px;
            color: #1a1a2e;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .start-btn:hover {
            background: #45b7aa;
            box-shadow: 0 0 15px rgba(78, 205, 196, 0.4);
        }

        /* Mobile top bar - hidden on desktop */
        .mobile-top-bar {
            display: none;
        }

        /* Touch controls - hidden on desktop */
        .touch-controls {
            display: none;
        }

        /* Touch button styles */
        .touch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .touch-group-left, .touch-group-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .touch-btn {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            border: 1px solid rgba(78, 205, 196, 0.3);
            background: rgba(78, 205, 196, 0.12);
            color: #4ecdc4;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: background 0.1s;
        }

        .touch-btn:active {
            background: rgba(78, 205, 196, 0.35);
        }

        .touch-btn-accent {
            background: rgba(78, 205, 196, 0.2);
            border-color: rgba(78, 205, 196, 0.5);
        }

        .touch-btn-small {
            width: 44px;
            height: 44px;
            font-size: 16px;
            border-radius: 10px;
        }

        /* Next piece preview for mobile (smaller) */
        .next-piece-mobile {
            display: grid;
            grid-template-columns: repeat(4, 12px);
            grid-template-rows: repeat(4, 12px);
            gap: 1px;
            margin: 4px auto 0;
        }

        .next-cell-mobile {
            width: 12px;
            height: 12px;
            background: #1a1a1a;
            border-radius: 1px;
        }

        .compact {
            padding: 8px;
        }

        .compact .panel-title {
            font-size: 10px;
            margin-bottom: 2px;
        }

        .compact .panel-value {
            font-size: 16px;
        }

        /* Mobile layout */
        @media (max-width: 600px) {
            body {
                align-items: flex-start;
                padding: 0;
                overflow: hidden;
                height: 100vh;
                height: 100dvh;
            }

            .game-container {
                flex-direction: column;
                align-items: center;
                gap: 8px;
                padding: 8px;
                border-radius: 0;
                width: 100%;
                height: 100vh;
                height: 100dvh;
                background: transparent;
                box-shadow: none;
                backdrop-filter: none;
            }

            .mobile-top-bar {
                display: flex;
                gap: 8px;
                width: 100%;
                justify-content: center;
                flex-shrink: 0;
            }

            .mobile-top-bar .panel-box {
                flex: 1;
                max-width: 120px;
            }

            .side-panel {
                display: none;
            }

            .game-board {
                flex-shrink: 0;
            }

            .touch-controls {
                display: block;
                width: 100%;
                max-width: 360px;
                padding: 8px 0;
                flex-shrink: 0;
            }

            .controls {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="mobile-top-bar">
            <div class="panel-box compact">
                <div class="panel-title">Score</div>
                <div class="panel-value" id="score-mobile">0</div>
            </div>
            <div class="panel-box compact">
                <div class="panel-title">Level</div>
                <div class="panel-value" id="level-mobile">1</div>
            </div>
            <div class="panel-box compact">
                <div class="panel-title">Next</div>
                <div class="next-piece-mobile" id="next-piece-mobile"></div>
            </div>
        </div>

        <div class="game-board" id="board"></div>

        <div class="side-panel">
            <div class="panel-box">
                <div class="panel-title">Score</div>
                <div class="panel-value" id="score">0</div>
            </div>

            <div class="panel-box">
                <div class="panel-title">Level</div>
                <div class="panel-value" id="level">1</div>
            </div>

            <div class="panel-box">
                <div class="panel-title">Next</div>
                <div class="next-piece" id="next-piece"></div>
            </div>

            <div class="panel-box controls">
                <div class="panel-title">Controls</div>
                <div><span>← →</span> Move</div>
                <div><span>↑</span> Rotate</div>
                <div><span>↓</span> Soft Drop</div>
                <div><span>Space</span> Hard Drop</div>
                <div><span>P</span> Pause</div>
            </div>
        </div>

        <div class="touch-controls" id="touch-controls">
            <div class="touch-row">
                <div class="touch-group-left">
                    <button class="touch-btn" id="btn-left" aria-label="Move Left">&#9664;</button>
                    <button class="touch-btn" id="btn-down" aria-label="Soft Drop">&#9660;</button>
                    <button class="touch-btn" id="btn-right" aria-label="Move Right">&#9654;</button>
                </div>
                <div class="touch-group-right">
                    <button class="touch-btn touch-btn-accent" id="btn-rotate" aria-label="Rotate">&#10227;</button>
                    <button class="touch-btn touch-btn-accent" id="btn-drop" aria-label="Hard Drop">&#9195;</button>
                    <button class="touch-btn touch-btn-small" id="btn-pause" aria-label="Pause">&#9208;</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="game-over" id="game-over">
        <h2>Game Over!</h2>
        <div class="panel-box">
            <div class="panel-title">Final Score</div>
            <div class="panel-value" id="final-score">0</div>
        </div>
        <button onclick="restartGame()">Play Again</button>
    </div>
    
    <script>
        const COLS = 10;
        const ROWS = 20;
        const BOARD = document.getElementById('board');
        const NEXT_BOARD = document.getElementById('next-piece');
        const NEXT_BOARD_MOBILE = document.getElementById('next-piece-mobile');
        const SCORE = document.getElementById('score');
        const SCORE_MOBILE = document.getElementById('score-mobile');
        const LEVEL = document.getElementById('level');
        const LEVEL_MOBILE = document.getElementById('level-mobile');
        const GAME_OVER = document.getElementById('game-over');
        const FINAL_SCORE = document.getElementById('final-score');
        
        let board = [];
        let score = 0;
        let level = 1;
        let gameInterval;
        let isPaused = false;
        let isGameOver = false;
        let isAnimating = false;
        
        const SHAPES = [
            [[1, 1, 1, 1]], // I
            [[1, 1], [1, 1]], // O
            [[0, 1, 0], [1, 1, 1]], // T
            [[1, 0, 0], [1, 1, 1]], // L
            [[0, 0, 1], [1, 1, 1]], // J
            [[0, 1, 1], [1, 1, 0]], // S
            [[1, 1, 0], [0, 1, 1]]  // Z
        ];
        
        const COLORS = [
            '#00f5ff', // I - cyan
            '#ffff00', // O - yellow
            '#a855f7', // T - purple
            '#ff9500', // L - orange
            '#0066ff', // J - blue
            '#22c55e', // S - green
            '#ef4444'  // Z - red
        ];

        const COLORS_LIGHT = [
            '#66fbff', '#ffff88', '#c084fc', '#ffb347',
            '#4d94ff', '#4ade80', '#f87171'
        ];

        const COLOR_INDEX = {};
        COLORS.forEach((c, i) => COLOR_INDEX[c] = i);

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function stylePieceCell(cell, colorIndex) {
            const base = COLORS[colorIndex];
            const light = COLORS_LIGHT[colorIndex];
            cell.style.background = `linear-gradient(135deg, ${light} 0%, ${base} 100%)`;
            cell.style.boxShadow = `0 0 8px ${hexToRgba(base, 0.6)}, inset 0 1px 1px rgba(255,255,255,0.2)`;
            cell.style.border = `1px solid ${hexToRgba(base, 0.5)}`;
        }

        function animateValue(element) {
            element.classList.add('pop');
            setTimeout(() => element.classList.remove('pop'), 150);
        }

        function updateSpeed() {
            clearInterval(gameInterval);
            const speed = Math.max(100, 1000 - (level - 1) * 100);
            gameInterval = setInterval(gameLoop, speed);
        }

        function syncScore(val) {
            SCORE.textContent = val;
            SCORE_MOBILE.textContent = val;
        }

        function syncLevel(val) {
            LEVEL.textContent = val;
            LEVEL_MOBILE.textContent = val;
        }

        // Dynamic cell sizing for mobile
        let cellSize = 30;
        function resizeBoard() {
            const isMobile = window.innerWidth <= 600;
            if (!isMobile) {
                cellSize = 30;
            } else {
                const topBar = document.querySelector('.mobile-top-bar');
                const touchControls = document.getElementById('touch-controls');
                const topH = topBar ? topBar.offsetHeight + 8 : 60;
                const bottomH = touchControls ? touchControls.offsetHeight + 8 : 80;
                const containerPad = 16;
                const availH = window.innerHeight - topH - bottomH - containerPad;
                const availW = window.innerWidth - 16;
                const fromH = Math.floor(availH / ROWS);
                const fromW = Math.floor(availW / COLS);
                cellSize = Math.min(fromH, fromW, 30);
                cellSize = Math.max(cellSize, 14);
            }
            BOARD.style.gridTemplateColumns = `repeat(${COLS}, ${cellSize}px)`;
            BOARD.style.gridTemplateRows = `repeat(${ROWS}, ${cellSize}px)`;
            const cells = BOARD.children;
            for (let i = 0; i < cells.length; i++) {
                cells[i].style.width = cellSize + 'px';
                cells[i].style.height = cellSize + 'px';
            }
        }

        function createNextBoardMobile() {
            NEXT_BOARD_MOBILE.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const cell = document.createElement('div');
                cell.className = 'next-cell-mobile';
                NEXT_BOARD_MOBILE.appendChild(cell);
            }
        }

        function drawNextMobile() {
            const cells = NEXT_BOARD_MOBILE.children;
            if (!cells.length) return;
            for (let i = 0; i < cells.length; i++) {
                cells[i].style.background = '#1a1a1a';
                cells[i].style.boxShadow = 'none';
            }
            const shape = nextPiece.shape;
            const offsetX = Math.floor((4 - shape[0].length) / 2);
            const offsetY = Math.floor((4 - shape.length) / 2);
            for (let y = 0; y < shape.length; y++) {
                for (let x = 0; x < shape[y].length; x++) {
                    if (shape[y][x]) {
                        const index = (y + offsetY) * 4 + (x + offsetX);
                        if (index >= 0 && index < 16) {
                            const ci = COLOR_INDEX[nextPiece.color];
                            cells[index].style.background = COLORS[ci];
                        }
                    }
                }
            }
        }

        window.addEventListener('resize', () => {
            resizeBoard();
            draw();
        });

        function createBoard() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
            BOARD.innerHTML = '';
            for (let i = 0; i < ROWS * COLS; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                BOARD.appendChild(cell);
            }
        }
        
        function createNextBoard() {
            NEXT_BOARD.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const cell = document.createElement('div');
                cell.className = 'next-cell';
                NEXT_BOARD.appendChild(cell);
            }
        }
        
        function getRandomPiece() {
            const shapeIndex = Math.floor(Math.random() * SHAPES.length);
            return {
                shape: SHAPES[shapeIndex],
                color: COLORS[shapeIndex],
                x: Math.floor(COLS / 2) - Math.ceil(SHAPES[shapeIndex][0].length / 2),
                y: 0
            };
        }
        
        let currentPiece = getRandomPiece();
        let nextPiece = getRandomPiece();

        function getGhostY() {
            const ghost = { shape: currentPiece.shape, x: currentPiece.x, y: currentPiece.y };
            while (isValidMove(ghost, 0, 1)) {
                ghost.y++;
            }
            return ghost.y;
        }
        
        function draw() {
            // Clear board display
            const cells = BOARD.children;
            for (let i = 0; i < cells.length; i++) {
                cells[i].style.background = '#1a1a1a';
                cells[i].style.boxShadow = 'none';
                cells[i].style.border = '1px solid rgba(255, 255, 255, 0.03)';
            }

            // Draw placed pieces
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x]) {
                        const index = y * COLS + x;
                        const ci = COLOR_INDEX[board[y][x]];
                        if (ci !== undefined) {
                            stylePieceCell(cells[index], ci);
                        } else {
                            cells[index].style.background = board[y][x];
                        }
                    }
                }
            }

            // Draw ghost piece
            const ghostY = getGhostY();
            if (ghostY !== currentPiece.y) {
                for (let y = 0; y < currentPiece.shape.length; y++) {
                    for (let x = 0; x < currentPiece.shape[y].length; x++) {
                        if (currentPiece.shape[y][x]) {
                            const boardY = ghostY + y;
                            const boardX = currentPiece.x + x;
                            if (boardY >= 0 && boardY < ROWS && boardX >= 0 && boardX < COLS) {
                                const index = boardY * COLS + boardX;
                                cells[index].style.background = hexToRgba(currentPiece.color, 0.15);
                                cells[index].style.border = `1px solid ${hexToRgba(currentPiece.color, 0.3)}`;
                            }
                        }
                    }
                }
            }

            // Draw current piece
            for (let y = 0; y < currentPiece.shape.length; y++) {
                for (let x = 0; x < currentPiece.shape[y].length; x++) {
                    if (currentPiece.shape[y][x]) {
                        const boardY = currentPiece.y + y;
                        const boardX = currentPiece.x + x;
                        if (boardY >= 0 && boardY < ROWS && boardX >= 0 && boardX < COLS) {
                            const index = boardY * COLS + boardX;
                            const ci = COLOR_INDEX[currentPiece.color];
                            stylePieceCell(cells[index], ci);
                        }
                    }
                }
            }
        }
        
        function drawNext() {
            const cells = NEXT_BOARD.children;
            for (let i = 0; i < cells.length; i++) {
                cells[i].style.background = '#1a1a1a';
                cells[i].style.boxShadow = 'none';
                cells[i].style.border = 'none';
            }

            const shape = nextPiece.shape;
            const offsetX = Math.floor((4 - shape[0].length) / 2);
            const offsetY = Math.floor((4 - shape.length) / 2);

            for (let y = 0; y < shape.length; y++) {
                for (let x = 0; x < shape[y].length; x++) {
                    if (shape[y][x]) {
                        const index = (y + offsetY) * 4 + (x + offsetX);
                        if (index >= 0 && index < 16) {
                            const ci = COLOR_INDEX[nextPiece.color];
                            const base = COLORS[ci];
                            const light = COLORS_LIGHT[ci];
                            cells[index].style.background = `linear-gradient(135deg, ${light} 0%, ${base} 100%)`;
                            cells[index].style.boxShadow = `0 0 6px ${hexToRgba(base, 0.5)}`;
                        }
                    }
                }
            }
        }
        
        function isValidMove(piece, offsetX = 0, offsetY = 0) {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        const newX = piece.x + x + offsetX;
                        const newY = piece.y + y + offsetY;
                        
                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return false;
                        }
                        
                        if (newY >= 0 && board[newY][newX]) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }
        
        function rotatePiece() {
            const rotated = currentPiece.shape[0].map((_, i) =>
                currentPiece.shape.map(row => row[i]).reverse()
            );
            
            const originalShape = currentPiece.shape;
            currentPiece.shape = rotated;
            
            if (!isValidMove(currentPiece)) {
                currentPiece.shape = originalShape;
            }
        }
        
        function movePiece(dx, dy) {
            if (isValidMove(currentPiece, dx, dy)) {
                currentPiece.x += dx;
                currentPiece.y += dy;
                return true;
            }
            return false;
        }
        
        function lockPiece() {
            for (let y = 0; y < currentPiece.shape.length; y++) {
                for (let x = 0; x < currentPiece.shape[y].length; x++) {
                    if (currentPiece.shape[y][x]) {
                        const boardY = currentPiece.y + y;
                        const boardX = currentPiece.x + x;
                        if (boardY >= 0) {
                            board[boardY][boardX] = currentPiece.color;
                        }
                    }
                }
            }
            
            clearLines();
            currentPiece = nextPiece;
            nextPiece = getRandomPiece();
            drawNext();
            drawNextMobile();

            if (!isValidMove(currentPiece)) {
                gameOver();
            }
        }
        
        function clearLines() {
            const fullRows = [];
            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== 0)) {
                    fullRows.push(y);
                }
            }

            if (fullRows.length === 0) return;

            // Phase 1: Flash the rows white
            isAnimating = true;
            const cells = BOARD.children;
            fullRows.forEach(row => {
                for (let x = 0; x < COLS; x++) {
                    const index = row * COLS + x;
                    cells[index].style.background = 'rgba(255, 255, 255, 0.9)';
                    cells[index].style.boxShadow = '0 0 15px rgba(255, 255, 255, 0.8)';
                }
            });

            // Phase 2: Remove rows after delay
            setTimeout(() => {
                fullRows.sort((a, b) => b - a);
                fullRows.forEach(row => {
                    board.splice(row, 1);
                    board.unshift(Array(COLS).fill(0));
                });

                const oldLevel = level;
                score += fullRows.length * 100 * level;
                level = Math.floor(score / 1000) + 1;
                syncScore(score);
                animateValue(SCORE);
                animateValue(SCORE_MOBILE);
                if (level !== oldLevel) {
                    syncLevel(level);
                    animateValue(LEVEL);
                    animateValue(LEVEL_MOBILE);
                    updateSpeed();
                }

                isAnimating = false;
                draw();
            }, 200);
        }
        
        function gameOver() {
            isGameOver = true;
            clearInterval(gameInterval);
            FINAL_SCORE.textContent = score;
            GAME_OVER.classList.add('show');
        }
        
        function restartGame() {
            score = 0;
            level = 1;
            isGameOver = false;
            isPaused = false;
            isAnimating = false;
            syncScore('0');
            syncLevel('1');
            GAME_OVER.classList.remove('show');

            createBoard();
            createNextBoard();
            createNextBoardMobile();
            resizeBoard();
            currentPiece = getRandomPiece();
            nextPiece = getRandomPiece();
            drawNext();
            drawNextMobile();

            updateSpeed();
        }
        
        function gameLoop() {
            if (!isPaused && !isGameOver && !isAnimating) {
                if (!movePiece(0, 1)) {
                    lockPiece();
                }
                draw();
            }
        }
        
        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            
            switch (e.key) {
                case 'ArrowLeft':
                    movePiece(-1, 0);
                    break;
                case 'ArrowRight':
                    movePiece(1, 0);
                    break;
                case 'ArrowDown':
                    if (movePiece(0, 1)) {
                        score += 1;
                        syncScore(score);
                        animateValue(SCORE);
                        animateValue(SCORE_MOBILE);
                    }
                    break;
                case 'ArrowUp':
                    rotatePiece();
                    break;
                case ' ':
                    while (movePiece(0, 1)) {
                        score += 2;
                    }
                    syncScore(score);
                    animateValue(SCORE);
                    animateValue(SCORE_MOBILE);
                    break;
                case 'p':
                case 'P':
                    isPaused = !isPaused;
                    break;
            }
            
            draw();
        });
        
        // Start the game
        createBoard();
        createNextBoard();
        createNextBoardMobile();
        resizeBoard();
        drawNext();
        drawNextMobile();
        gameInterval = setInterval(gameLoop, 1000);

        // Touch controls
        (function setupTouchControls() {
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');
            const btnDown = document.getElementById('btn-down');
            const btnRotate = document.getElementById('btn-rotate');
            const btnDrop = document.getElementById('btn-drop');
            const btnPause = document.getElementById('btn-pause');

            function setupRepeat(btn, action) {
                let timeout, interval;
                function start(e) {
                    e.preventDefault();
                    if (isGameOver) return;
                    action();
                    draw();
                    timeout = setTimeout(() => {
                        interval = setInterval(() => {
                            action();
                            draw();
                        }, 50);
                    }, 200);
                }
                function stop(e) {
                    e.preventDefault();
                    clearTimeout(timeout);
                    clearInterval(interval);
                }
                btn.addEventListener('touchstart', start, { passive: false });
                btn.addEventListener('touchend', stop, { passive: false });
                btn.addEventListener('touchcancel', stop, { passive: false });
            }

            function setupSingle(btn, action) {
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (isGameOver) return;
                    action();
                    draw();
                }, { passive: false });
            }

            setupRepeat(btnLeft, () => movePiece(-1, 0));
            setupRepeat(btnRight, () => movePiece(1, 0));
            setupRepeat(btnDown, () => {
                if (movePiece(0, 1)) {
                    score += 1;
                    syncScore(score);
                }
            });

            setupSingle(btnRotate, () => rotatePiece());
            setupSingle(btnDrop, () => {
                while (movePiece(0, 1)) {
                    score += 2;
                }
                syncScore(score);
            });

            btnPause.addEventListener('touchstart', (e) => {
                e.preventDefault();
                isPaused = !isPaused;
            }, { passive: false });

            // Swipe gestures on the board
            let touchStartX = 0;
            let touchStartY = 0;
            let touchStartTime = 0;

            BOARD.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                touchStartTime = Date.now();
            }, { passive: false });

            BOARD.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (isGameOver) return;
                const touch = e.changedTouches[0];
                const dx = touch.clientX - touchStartX;
                const dy = touch.clientY - touchStartY;
                const dt = Date.now() - touchStartTime;
                const absDx = Math.abs(dx);
                const absDy = Math.abs(dy);
                const threshold = 30;

                if (absDx < threshold && absDy < threshold && dt < 300) {
                    // Tap = rotate
                    rotatePiece();
                } else if (absDx > absDy && absDx > threshold) {
                    // Horizontal swipe
                    movePiece(dx > 0 ? 1 : -1, 0);
                } else if (dy > threshold && absDy > absDx) {
                    // Swipe down = soft drop
                    if (movePiece(0, 1)) {
                        score += 1;
                        syncScore(score);
                    }
                }
                draw();
            }, { passive: false });

            // Prevent scrolling on the entire game area
            document.querySelector('.game-container').addEventListener('touchmove', (e) => {
                e.preventDefault();
            }, { passive: false });
        })();
    </script>
</body>
</html>
